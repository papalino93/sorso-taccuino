<!-- La pagina del TUO sito che incorpora lo spazio di team. -->
<!-- L'indirizzo dell'iframe, con il token, lo genera il tuo server a ogni caricamento della pagina. -->
<iframe id="sorso" title="Degustazioni del club"
        src="https://DOMINIO-SORSO/embed?p=ID_PARTNER&token=TOKEN_FIRMATO_DAL_TUO_SERVER"
        width="100%" height="700" style="border:0; max-width:640px"
        allow="" referrerpolicy="no-referrer"></iframe>

<script>
  // Facoltativo: l'iframe comunica la propria altezza, così eviti la barra di scorrimento.
  const ORIGINE_SORSO = "https://DOMINIO-SORSO";
  window.addEventListener("message", (e) => {
    if (e.origin !== ORIGINE_SORSO) return;                 // ignora i messaggi di altri
    if (e.data && e.data.type === "sorso:height") {
      document.getElementById("sorso").style.height = e.data.height + "px";
    }
  });
</script>
